<header
  class="sticky top-0 z-50 flex items-center justify-between border-b border-slate-700 bg-slate-900 px-8 py-4 text-white shadow-lg"
>
  <!-- Logo -->
  <a
    routerLink="/"
    class="text-2xl font-bold tracking-wide transition-colors hover:text-indigo-400"
  >
    Student Directory - Dynamic Routing
  </a>

  <!-- Navigation -->
  <nav class="flex items-center gap-2">
    <a
      routerLink="/"
      routerLinkActive="bg-indigo-600 text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-lg px-4 py-2 text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white"
    >
      Home
    </a>

    <a
      routerLink="/about"
      routerLinkActive="bg-indigo-600 text-white"
      class="rounded-lg px-4 py-2 text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white"
    >
      About
    </a>
  </nav>
</header>
